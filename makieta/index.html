<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adria View – wybierz mieszkanie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: spokojny salon sprzedaży – mało słów, duży obraz, precyzyjne liczby
   IDEA: makieta na stole w biurze sprzedaży – budynek w centrum, karty jak katalog mieszkań
   PICTURE: renderowany budynek na cały ekran, z podświetlonymi mieszkaniami i płynnym obrotem kamery
   COLOUR and TYPE: tynk #f4f1ec, grafit ram okiennych #1e1d1b, dąb #8c6440; statusy zielony/żółty/czerwony; Jost + Inter
   LAYOUT: scena pełnoekranowa, pływające jasne panele; na telefonie scena 16:9 u góry, panele pod nią */
:root{--bg:#141311;--paper:rgba(248,246,242,.94);--ink:#1e1d1b;--mute:#6d675f;--line:rgba(30,29,27,.12);--oak:#8c6440;
--hf:Jost,Inter,system-ui,sans-serif;--ok:#2fb36d;--res:#e6b422;--sold:#d9474b;--r:14px;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--oak);outline-offset:2px}
h1,h2,h3{font-family:var(--hf);font-weight:500;margin:0;line-height:1.05;text-wrap:balance}
.app{position:fixed;inset:0;overflow:hidden}
.stage{position:absolute;inset:0;overflow:hidden;background:#20201d;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage>img,.stage>video,.stage>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage>img{transition:opacity .5s ease}
#clips video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none}
#clips video.on{opacity:1}
#seq{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none}#seq.on{opacity:1}
#ov{transition:opacity .25s}#ov.hide{opacity:0;pointer-events:none}
#ov path{fill:var(--c);fill-opacity:.30;stroke:var(--c);stroke-opacity:.95;stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill-opacity .15s,opacity .2s}
#ov.plain path{fill-opacity:0;stroke-opacity:0}
#ov path:hover,#ov path.sel{fill-opacity:.62;stroke-opacity:1;stroke-width:3}
#ov.plain path:hover,#ov.plain path.sel{fill:#fff;fill-opacity:.35;stroke:#fff;stroke-opacity:1}
#ov path.dim{opacity:.12;pointer-events:none}
#ov path.pulse{animation:pulse 1.1s ease 3}
@keyframes pulse{50%{fill-opacity:.9}}
.a{--c:var(--ok)}.r{--c:var(--res)}.s{--c:var(--sold)}
/* górny pasek */
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:16px;padding:14px 20px;z-index:20;
background:linear-gradient(180deg,rgba(10,9,8,.55),rgba(10,9,8,0));color:#fff;pointer-events:none}
.top>*{pointer-events:auto}
.logo{display:flex;flex-direction:column;line-height:1;font-family:var(--hf);font-weight:500;letter-spacing:.32em;font-size:17px}
.logo small{font-size:10px;letter-spacing:.42em;opacity:.8;margin-top:5px}
.tabs{display:flex;gap:4px;margin:0 auto;background:rgba(20,19,17,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:4px;border-radius:999px}
.tabs button{padding:9px 16px;border-radius:999px;font-weight:500;font-size:14px;color:rgba(255,255,255,.82);min-height:40px}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink)}
.tog{display:flex;background:rgba(20,19,17,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;padding:4px}
.tog button{padding:8px 14px;border-radius:999px;color:rgba(255,255,255,.82);font-size:14px;min-height:40px}
.tog button[aria-pressed=true]{background:#fff;color:var(--ink)}
.icon{width:44px;height:44px;border-radius:50%;background:rgba(20,19,17,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;color:#fff}
/* panele */
.panel{position:absolute;z-index:15;background:var(--paper);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.filters{left:20px;top:84px;width:300px;padding:18px 18px 16px;max-height:calc(100% - 190px);overflow:auto}
.filters h3{font-size:22px}.fh{display:flex;align-items:center;justify-content:space-between;gap:8px}.filters.min .fb{display:none}.filters.min{padding-bottom:10px}.filters.min .count{margin-top:6px}
.lbl{font-size:13px;color:var(--mute);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:44px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.range label{display:flex;flex-direction:column;font-size:13px;color:var(--mute)}
.range input{font-size:16px;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;margin-top:4px;color:var(--ink);background:#fff}
.sw{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-weight:500;min-height:40px}
.sw input{width:22px;height:22px;accent-color:var(--ink)}
.count{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.count b{font-family:var(--hf);font-size:30px;font-weight:500}
.reset{color:var(--oak);font-weight:600;font-size:14px;min-height:40px}
.legend{position:absolute;right:20px;bottom:24px;z-index:14;display:flex;gap:14px;padding:10px 16px;font-size:13px;font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:0}
.rot{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:14;display:flex;align-items:center;gap:12px;padding:6px}
.rot button.arr{width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.dots{display:flex;gap:6px;padding:0 6px}
.dots .dot{width:10px;height:10px;border-radius:50%;background:rgba(30,29,27,.22)}
.dots .dot.cur{background:var(--ink);transform:scale(1.25)}
.tip{position:absolute;z-index:30;pointer-events:none;background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25);white-space:nowrap;opacity:0;transition:opacity .12s}
.tip b{font-family:var(--hf);font-size:17px;font-weight:500;margin-right:6px}
/* karta mieszkania */
.card{right:20px;top:84px;bottom:20px;width:440px;display:flex;flex-direction:column;transform:translateX(120%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:25}
.card.open{transform:none}
.card header{padding:18px 20px 12px;display:flex;align-items:flex-start;gap:12px}
.card h2{font-size:34px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:#f1efe9;background:color-mix(in srgb,var(--c) 18%,#fff);color:#2a2622;margin-top:8px}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.x{margin-left:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(30,29,27,.07);flex:none}
.body{overflow:auto;padding:0 20px 20px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.facts div{background:#fff;border-radius:10px;padding:10px 12px}
.facts span{display:block;font-size:12px;color:var(--mute)}
.facts b{font-family:var(--hf);font-size:22px;font-weight:500;white-space:nowrap}
.plan{background:#fff;border-radius:12px;padding:10px;display:grid;place-items:center;min-height:180px;cursor:zoom-in}
.plan img{max-width:100%;max-height:330px;display:block}
.plan.frame{padding:0;overflow:hidden;cursor:default;height:420px}.plan.frame iframe{width:100%;height:100%;border:0;display:block}
.plan.pdf{cursor:pointer;text-decoration:none;color:var(--ink);gap:4px;padding:26px 16px;text-align:center;border:1px dashed rgba(30,29,27,.25)}
.plan.pdf b{font-family:var(--hf);font-weight:500;font-size:20px;margin-top:6px}.plan.pdf span{font-size:13px;color:var(--mute)}
table.rooms{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.rooms td{padding:7px 0;border-bottom:1px solid var(--line)}
.rooms td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rooms tr.sum td{font-weight:600;border-bottom:0}.rooms tr.ex td{color:var(--mute);border:0;padding-top:2px}
.acts{display:grid;gap:8px;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:12px;font-weight:600;text-decoration:none;background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.note{font-size:12px;color:var(--mute);margin-top:10px}
/* widoki pełnoekranowe */
.view{position:absolute;inset:0;z-index:12;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}
.view.on{opacity:1;visibility:visible}
#hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,10,8,.72),rgba(12,10,8,.15) 60%,rgba(12,10,8,0)),linear-gradient(0deg,rgba(12,10,8,.55),rgba(12,10,8,0) 45%)}
#hero .txt{position:absolute;left:max(6vw,24px);bottom:max(10vh,40px);color:#fff;max-width:620px}
#hero h1{font-size:clamp(52px,8vw,112px);letter-spacing:-.02em}
#hero p{font-size:clamp(16px,1.6vw,20px);opacity:.9;margin:14px 0 0}
.kpis{display:flex;flex-wrap:wrap;gap:28px;margin:30px 0 32px}
.kpis div{display:flex;flex-direction:column}
.kpis b{font-family:var(--hf);font-weight:500;font-size:clamp(26px,3vw,38px);line-height:1}
.kpis span{font-size:13px;opacity:.8;margin-top:6px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.cta .btn{padding:0 26px;min-height:54px;font-size:16px}
.cta .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4);backdrop-filter:blur(8px)}
/* lista */
.list{left:20px;top:84px;bottom:20px;width:min(560px,calc(100% - 40px));display:flex;flex-direction:column}
.list header{padding:18px 20px 8px;display:flex;align-items:baseline;gap:12px}
.list h3{font-size:24px}
.list .sc{overflow:auto;padding:0 12px 12px}
table.apts{width:100%;border-collapse:collapse;font-size:14px}
.apts th{position:sticky;top:0;background:#f8f6f2;text-align:right;font-size:12px;color:var(--mute);font-weight:500;padding:8px;cursor:pointer;white-space:nowrap}
.apts th:first-child,.apts td:first-child{text-align:left}
.apts td{padding:10px 8px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.apts tbody tr{cursor:pointer}.apts tbody tr:hover{background:#fff}
.apts td .st{margin:0}
/* galeria */
.gal{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#0e0d0c}
.gal::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;position:relative;overflow:hidden}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.02);transition:transform 12s linear}
.slide.cur img{transform:scale(1.10)}
.slide figcaption{position:absolute;left:max(5vw,20px);bottom:56px;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.slide figcaption span{display:block;font-size:14px;opacity:.85;margin-bottom:6px}
.slide figcaption b{font-family:var(--hf);font-weight:500;font-size:clamp(30px,4vw,52px)}
.slide::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(0deg,rgba(0,0,0,.5),transparent);pointer-events:none}
.slide figcaption{z-index:1}
.gnav{position:absolute;right:max(5vw,20px);bottom:48px;display:flex;gap:10px;z-index:3}
.gnav button{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
/* okolica: dzień / noc */
.cmp{position:absolute;inset:0;overflow:hidden;background:#000;cursor:ew-resize;touch-action:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .night{clip-path:inset(0 0 0 var(--x,50%))}
.cmp .bar{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:#fff;transform:translateX(-1px)}
.cmp .knob{position:absolute;top:50%;left:var(--x,50%);transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 24px rgba(0,0,0,.35);font-weight:600}
.cmp .tagL,.cmp .tagR{position:absolute;bottom:40px;color:#fff;font-family:var(--hf);font-size:22px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.cmp .tagL{left:max(5vw,20px)}.cmp .tagR{right:max(5vw,20px)}
.zoom{position:fixed;inset:0;z-index:60;background:rgba(14,13,12,.92);display:none;place-items:center;padding:20px}
.zoom.on{display:grid}.zoom{overflow:auto;place-items:start center}.zoom img{max-width:min(100%,900px);max-height:none;width:auto;background:#fff;border-radius:10px;padding:10px}
.zoom .x{position:absolute;top:16px;right:16px;background:#fff}
.load{position:absolute;inset:0;display:grid;place-items:center;color:#fff;z-index:50;background:#141311;font-family:var(--hf);font-size:20px;transition:opacity .5s}
.load.done{opacity:0;pointer-events:none}
@media (max-width:900px),(orientation:portrait){
 .app{position:static;overflow:visible}
 body{overflow:auto;height:auto}
 .top{position:sticky;background:#141311;flex-wrap:wrap;padding:10px 12px;gap:8px}
 .tabs{order:3;width:100%;overflow-x:auto;margin:0}
 .tabs button{flex:none;padding:8px 12px}
 .tog{margin-left:auto}
 .main{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden}
 .main .view{position:absolute}
 .panel{position:relative;left:auto;right:auto;top:auto;bottom:auto;width:auto;margin:12px;max-height:none}
 .filters{max-height:none}
 .legend{position:relative;right:auto;bottom:auto;margin:12px;justify-content:center}
 .panel.rot{position:absolute;left:50%;top:auto;bottom:8px;margin:0;transform:translateX(-50%);padding:4px;gap:6px}.rot button.arr{width:44px;height:44px}.dots{display:none}
 .card{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;margin:0;max-height:88vh;border-radius:18px 18px 0 0;transform:translateY(105%)}
 .list{position:relative;width:auto;margin:12px}
 .list .sc{max-height:none}
 #hero .txt{left:16px;right:16px;bottom:16px}
 #hero .kpis{display:none}#hero p{display:none}
 #hero h1{font-size:40px}.cta .btn{min-height:46px;padding:0 16px;font-size:14px}
 .slide figcaption{bottom:20px}.gnav{bottom:14px}.gnav button{width:44px;height:44px}
 .side{display:block}
}
@media (min-width:901px) and (orientation:landscape){.main{position:absolute;inset:0}.side{display:contents}}
.lite .panel,.lite .tabs,.lite .tog,.lite .icon,.lite .cta .btn.ghost{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.lite .panel{background:#f6f4f0}.lite .tabs,.lite .tog,.lite .icon{background:rgba(20,19,17,.82)}
.lite #ov path{transition:none}.lite .stage>img{transition:opacity .3s linear}
.lite .slide img{transition:none;transform:none}.lite .slide.cur img{transform:none}
.lite .top{background:linear-gradient(180deg,rgba(10,9,8,.6),rgba(10,9,8,0))}
.lite #heroV{display:none}.lite #heroI{display:block!important}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
.litebadge{display:none;font-size:12px;font-weight:600;color:#fff;background:rgba(47,179,109,.9);padding:6px 10px;border-radius:999px;white-space:nowrap}.lite .litebadge{display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.slide.cur img{transform:scale(1.02)}}
</style>
</head>
<body>
<div class="app">
 <div class="top">
  <div class="logo">ADRIA VIEW<small>TORUŃSKA</small></div>
  <nav class="tabs" role="tablist" id="tabs">
   <button role="tab" data-v="start" aria-selected="true">Start</button>
   <button role="tab" data-v="budynek">Wybierz mieszkanie</button>
   <button role="tab" data-v="lista">Lista</button>
   <button role="tab" data-v="galeria">Galeria</button>
   <button role="tab" data-v="okolica">Dzień i noc</button>
  </nav>
  <span class="litebadge" title="Tryb dla ekranów interaktywnych">Tryb lekki</span>
  <div class="tog" id="mode"><button aria-pressed="true" data-m="day">Dzień</button><button aria-pressed="false" data-m="night">Noc</button></div>
  <button class="icon" id="fs" aria-label="Pełny ekran"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
 </div>
 <div class="main">
  <div class="stage" id="stage">
   <img id="imA" alt="Budynek Adria View" draggable="false">
   <img id="imB" alt="" draggable="false" style="opacity:0">
   <div id="clips"></div>
   <canvas id="seq" width="960" height="540"></canvas>
   <svg id="ov" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"></svg>
  </div>
  <div class="rot panel" id="rot">
   <button class="arr" id="prev" aria-label="Obróć w lewo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button>
   <div class="dots" id="dots"></div>
   <button class="arr" id="next" aria-label="Obróć w prawo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <section class="view on" id="hero">
   <video id="heroV" src="v/hero.mp4" autoplay muted loop playsinline preload="auto" poster="i/hero.webp"></video><img id="heroI" src="i/hero.webp" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
   <div class="shade"></div>
   <div class="txt">
    <h1>Adria View</h1>
    <p>ul. Toruńska 23, Bydgoszcz · inwestycja Budstol Invest</p>
    <div class="kpis" id="kpis"></div>
    <div class="cta"><button class="btn pri" data-go="budynek">Wybierz mieszkanie</button><button class="btn ghost" data-go="galeria">Zobacz wnętrza</button></div>
   </div>
  </section>
  <section class="view" id="galeria">
   <div class="gal" id="gal"></div>
   <div class="gnav"><button id="gp" aria-label="Poprzednie zdjęcie"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button><button id="gn" aria-label="Następne zdjęcie"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 5l7 7-7 7"/></svg></button></div>
  </section>
  <section class="view" id="okolica">
   <div class="cmp" id="cmp">
    <img src="i/dzien.webp" alt="Adria View z lotu ptaka w dzień">
    <img class="night" src="i/noc.webp" alt="Adria View z lotu ptaka nocą">
    <div class="bar"></div><div class="knob">⇆</div>
    <div class="tagL">Dzień</div><div class="tagR">Noc</div>
   </div>
  </section>
 </div>
 <div class="side">
  <aside class="panel filters" id="filters">
   <div class="fh"><h3>Znajdź mieszkanie</h3><button class="reset" id="fMinBtn" aria-expanded="true">Zwiń</button></div><div class="fb">
   <div class="lbl">Liczba pokoi</div><div class="chips" id="fRooms"></div>
   <div class="lbl">Piętro</div><div class="chips" id="fFloors"></div>
   <div class="lbl">Metraż (m²)</div>
   <div class="range"><label>od<input id="fMin" type="number" inputmode="decimal" min="0" step="1"></label><label>do<input id="fMax" type="number" inputmode="decimal" min="0" step="1"></label></div>
   <label class="sw">Tylko dostępne<input type="checkbox" id="fAvail"></label>
   <label class="sw">Pokaż dostępność na budynku<input type="checkbox" id="fShow" checked></label>
   </div><div class="count"><div><b id="cnt">0</b> mieszkań</div><button class="reset" id="fReset">Wyczyść</button></div>
  </aside>

/* karta */
function open(n){const a=A[n-1];sel=n;draw();const c=$('#card'),num='M.'+String(n).padStart(2,'0');
 const plan=a.img?`<div class="plan" id="planBox"><img src="${a.img}" alt="Rzut mieszkania ${num}"></div>`:EMBED?`<div class="plan frame"><iframe src="${a.pdf}#toolbar=0&navpanes=0&view=Fit" title="Rzut mieszkania ${num}" loading="lazy"></iframe></div>`:`<a class="plan pdf" href="${a.pdf}" target="_blank" rel="noopener"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><b>Rzut mieszkania ${num}</b><span>PDF ze strony budstol-invest.pl</span></a>`;
 const rooms=a.rooms?`<table class="rooms">${a.rooms.map(r=>`<tr><td>${esc(r[0])}</td><td>${fmt(r[1])} m²</td></tr>`).join('')}<tr class="sum"><td>Powierzchnia użytkowa</td><td>${fmt(a.a)} m²</td></tr>${(a.extra||[]).map(r=>`<tr class="ex"><td>${esc(r[0])}</td><td>${fmt(r[1])} m²</td></tr>`).join('')}</table>`:'';
 c.innerHTML=`<header><div><h2>Mieszkanie ${num}</h2><span class="st ${a.s}">${ST[a.s]}</span></div><button class="x" id="cx" aria-label="Zamknij">✕</button></header>
 <div class="body"><div class="facts"><div><span>Metraż</span><b>${fmt(a.a)} m²</b></div><div><span>Pokoje</span><b>${a.r}</b></div><div><span>Piętro</span><b>${a.f===0?'Parter':a.f}</b></div></div>
 ${plan}${rooms}<div class="acts"><a class="btn pri" href="${a.url}" target="_blank" rel="noopener">Zapytaj o ofertę</a>
 <button class="btn" id="cFull">Karta lokalu ${num}</button><a class="btn" href="${a.pdf}" target="_blank" rel="noopener">Pobierz rzut ${num} (PDF)</a><button class="btn" id="cShow">Pokaż na budynku</button></div>
 <p class="note">Rzut i powierzchnie z karty lokalu na budstol-invest.pl. Status według strony, stan na 24.11.2026. Wizualizacja poglądowa.</p></div>`;
 c.classList.add('open');$('#cx').onclick=close;$('#cShow').onclick=()=>{nav('budynek');locate(n);};
 const zf=()=>{$('#zoom img').src=a.full||a.img;$('#zoom').classList.add('on');};$('#cFull').onclick=zf;const pb=$('#planBox');if(pb)pb.onclick=()=>{$('#zoom img').src=a.full||a.img;$('#zoom').classList.add('on');};}
function close(){$('#card').classList.remove('open');sel=null;if(D)draw();}
function locate(n){const a=A[n-1];const go=()=>{draw();const p=$(`#ov path[data-n="${n}"]`);if(p){p.classList.add('pulse');setTimeout(()=>p.classList.remove('pulse'),3400);}};
 if(a.v!==view){goView(a.v);const w=setInterval(()=>{if(!busy&&!queue.length){clearInterval(w);go();}},120);}else go();}
$('#zoom').onclick=()=>$('#zoom').classList.remove('on');
/* filtry */
function chips(el,vals,set,lab){el.innerHTML=vals.map(v=>`<button class="chip" aria-pressed="false" data-v="${v}">${lab(v)}</button>`).join('');
 el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=+b.dataset.v;set.has(v)?set.delete(v):set.add(v);b.setAttribute('aria-pressed',set.has(v));upd();};}
function upd(){const mi=$('#fMin').value,ma=$('#fMax').value;F.min=mi===''?null:+mi;F.max=ma===''?null:+ma;F.avail=$('#fAvail').checked;showSt=$('#fShow').checked;
 const m=A.filter(match);$('#cnt').textContent=m.length;draw();table();}
function table(){const rows=A.filter(match).sort((x,y)=>(x[sortK]>y[sortK]?1:x[sortK]<y[sortK]?-1:0)*sortD||x.n-y.n);
 $('#tb').innerHTML=rows.map(a=>`<tr data-n="${a.n}"><td><b>M.${String(a.n).padStart(2,'0')}</b></td><td>${a.f===0?'P':a.f}</td><td>${a.r}</td><td>${fmt(a.a)} m²</td><td><span class="st ${a.s}">${ST[a.s]}</span></td></tr>`).join('')||'<tr><td colspan="5" style="text-align:left;padding:16px 8px">Żadne mieszkanie nie spełnia filtrów.</td></tr>';
 $('#listNote').textContent=rows.length+' z '+A.length;}
$('#tb').onclick=e=>{const r=e.target.closest('tr[data-n]');if(!r)return;const n=+r.dataset.n;nav('budynek');open(n);locate(n);};
$$('.apts th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortD=sortK===k?-sortD:1;sortK=k;table();});
['#fMin','#fMax','#fAvail','#fShow'].forEach(s=>$(s).addEventListener('input',upd));
const fm=$('#fMinBtn');fm.onclick=()=>{const m=$('#filters').classList.toggle('min');fm.textContent=m?'Rozwiń':'Zwiń';fm.setAttribute('aria-expanded',!m);};
if(innerWidth<1500&&innerWidth>900&&matchMedia('(orientation:landscape)').matches)fm.onclick();
$('#fReset').onclick=()=>{F.rooms.clear();F.floors.clear();$('#fMin').value=$('#fMax').value='';$('#fAvail').checked=false;$$('.chip').forEach(b=>b.setAttribute('aria-pressed',false));upd();};
/* nawigacja */
let cur='start';
function nav(v){cur=v;$$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
 $('#hero').classList.toggle('on',v==='start');$('#galeria').classList.toggle('on',v==='galeria');$('#okolica').classList.toggle('on',v==='okolica');
 const b=v==='budynek'||v==='lista';$('#filters').style.display=v==='budynek'?'':'none';$('#legend').style.display=b?'':'none';$('#rot').style.display=b?'':'none';$('#list').style.display=v==='lista'?'':'none';
 $('#mode').style.visibility=b?'visible':'hidden';if(!b)close();
 const h=$('#heroV');if(!window.LITE){v==='start'?h.play().catch(()=>{}):h.pause();}else{h.pause();h.removeAttribute('src');}
 if(v==='galeria')gObs();if(location.hash.slice(1)!==v)history.replaceState(null,'','#'+v);}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)nav(b.dataset.v);};
$$('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));
$('#mode').onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m);};
$('#fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}};
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['start','budynek','lista','galeria','okolica'].includes(h)&&h!==cur)nav(h);});
/* galeria */
$('#gal').innerHTML=GAL.map(([f,t,s])=>`<figure class="slide" style="margin:0"><img src="i/${f}.webp" alt="${t}" loading="lazy"><figcaption><span>${s}</span><b>${t}</b></figcaption></figure>`).join('');
let gi=0;function gStep(d){gi=Math.max(0,Math.min(GAL.length-1,gi+d));$$('.slide')[gi].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}
$('#gp').onclick=()=>gStep(-1);$('#gn').onclick=()=>gStep(1);
let go_=null;function gObs(){if(go_)return;go_=new IntersectionObserver(es=>es.forEach(en=>{en.target.classList.toggle('cur',en.isIntersecting);if(en.isIntersecting)gi=$$('.slide').indexOf(en.target);}),{root:$('#gal'),threshold:.6});$$('.slide').forEach(s=>go_.observe(s));}
/* dzień / noc */
const cmp=$('#cmp');let cd=false;const setX=e=>{const r=cmp.getBoundingClientRect();cmp.style.setProperty('--x',Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100))+'%');};
cmp.addEventListener('pointerdown',e=>{cd=true;cmp.setPointerCapture(e.pointerId);setX(e);});cmp.addEventListener('pointermove',e=>cd&&setX(e));cmp.addEventListener('pointerup',()=>cd=false);
/* start */
(window.DATA?Promise.resolve(window.DATA):fetch('data.json').then(r=>r.json())).then(async d=>{D=d;A=d.apts;
 const av=A.filter(a=>a.s==='a').length,mn=Math.min(...A.map(a=>a.a)),mx=Math.max(...A.map(a=>a.a));
 $('#kpis').innerHTML=[[A.length,'mieszkań'],['1–5','pokoi'],[`${Math.floor(mn)}–${Math.floor(mx)} m²`,'metraże'],[av,'dostępnych']].map(([b,s])=>`<div><b>${b}</b><span>${s}</span></div>`).join('');
 chips($('#fRooms'),[1,2,3,4],F.rooms,v=>v===4?'4+':v);chips($('#fFloors'),[0,1,2,3,4,5,6],F.floors,FS);
 $('#dots').innerHTML=Array.from({length:NV},(_,i)=>`<span class="dot"></span>`).join('');
 await show(still(mode,0),false);upd();warm();
 for(let k=0;k<NV;k++){pre(still('day',k));}
 /* rozgrzewanie: po starcie pobieramy w tle wszystkie przeloty bieżącego trybu, potem drugiego */
 const idle=()=>new Promise(r=>{const c=()=>(!busy&&!queue.length)?r():setTimeout(c,400);c();});
 const warmAll=async()=>{const ms=window.LITE?[mode]:[mode,mode==='day'?'night':'day'];for(const m of ms){for(let k=0;k<NV;k++)for(const t of ['f','r']){await idle();try{const r=await fetch(`${VDIR}/${m}_${k}_${t}.mp4`,{cache:'force-cache'});await r.arrayBuffer();}catch(e){}await new Promise(z=>setTimeout(z,window.LITE?600:150));}for(let k=0;k<NV;k++)pre(still(m,k));}};
 if(!window.LITE)setTimeout(warmAll,1500);
 $('#load').classList.add('done');
 const h=location.hash.slice(1);nav(['lekki','pelny'].includes(h)?'start':['budynek','lista','galeria','okolica'].includes(h)?h:'start');
}).catch(()=>{$('#load').textContent='Nie udało się wczytać danych makiety.';});
}
</script>
</body>
</html>
