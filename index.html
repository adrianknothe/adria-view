<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--line:#e7e3db;--tx:#1b2026;--mu:#7b838d;--soft:#f6f4f0;--w:#2f9e5b;--r:#d99a0b;--s:#cf4638;--sh:0 12px 40px rgba(27,32,38,.13)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--tx);background:#fff;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
.stage{position:fixed;inset:0;background:#fff}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
.panel{position:fixed;left:18px;top:18px;bottom:18px;width:336px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.brand small{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mu);font-weight:600}
.brand h1{font-size:23px;font-weight:700;letter-spacing:-.4px;margin-top:2px}
.brand p{font-size:12px;color:var(--mu);margin-top:3px}
.sum{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--mu)}
.sum b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.sum span{display:flex;align-items:center;gap:5px}
.filters{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.f h3{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mu);font-weight:600;margin-bottom:7px;display:flex;justify-content:space-between}
.f h3 em{font-style:normal;letter-spacing:0;text-transform:none;color:var(--tx);font-size:12px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{min-width:36px;justify-content:center;border:1px solid var(--line);background:#fff;color:var(--tx);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip:hover{border-color:#b9bcc0}.chip.on{background:var(--tx);border-color:var(--tx);color:#fff}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.rng{position:relative;height:26px}
.rng input{position:absolute;left:0;right:0;top:4px;width:100%;-webkit-appearance:none;appearance:none;background:none;pointer-events:none;height:18px;margin:0}
.rng:before{content:"";position:absolute;left:0;right:0;top:12px;height:3px;border-radius:2px;background:var(--line)}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;background:var(--tx);border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.3);cursor:pointer}
.rng input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--tx);border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.3);cursor:pointer}
.rhead{padding:12px 22px 8px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mu)}
.rhead b{color:var(--tx);font-size:13px}
.rhead button{border:0;background:none;color:var(--mu);font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
.rows{overflow:auto;flex:1;padding:0 12px 12px}
.row{display:grid;grid-template-columns:14px 56px 1fr 46px 60px;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;font-size:12.5px;cursor:pointer;font-variant-numeric:tabular-nums}
.row:hover{background:var(--soft)}.row.sel{background:var(--tx);color:#fff}
.row b{font-weight:600}.row span{color:var(--mu)}.row.sel span{color:#c9cdd2}
.row .a{text-align:right}
.none{padding:22px;text-align:center;color:var(--mu);font-size:13px}
.hud{position:fixed;left:calc(50% + 177px);transform:translateX(-50%);bottom:22px;display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--sh)}
.btn{background:transparent;border:0;color:var(--tx);border-radius:999px;padding:10px 15px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}.btn.on{background:var(--tx);color:#fff}
.btn.ar{font-size:15px;padding:8px 14px}
.hint{position:fixed;right:22px;bottom:30px;font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.tip{position:absolute;pointer-events:none;background:#1b2026;color:#fff;border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.5;display:none;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.tip b{font-size:13px}
.card{position:fixed;right:18px;top:18px;width:300px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:20px;display:none}
.card.open{display:block}
.card .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;font-size:15px;color:var(--tx)}
.card small{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mu);font-weight:600}
.card h2{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.card .st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;margin:8px 0 16px;padding:5px 11px;border-radius:999px;background:var(--soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.grid2 span{display:block;font-size:11px;color:var(--mu);margin-bottom:2px}.grid2 b{font-size:16px;font-weight:600}
.cta{display:block;text-align:center;margin-top:14px;background:var(--tx);color:#fff;text-decoration:none;border-radius:999px;padding:12px;font-size:13px;font-weight:600}
.cta2{display:block;width:100%;text-align:center;margin-top:8px;background:#fff;color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:11px;font-size:13px;font-weight:500;cursor:pointer}
.src{font-size:10.5px;color:var(--mu);margin-top:12px;line-height:1.5}
@media(max-width:900px){body{overflow:auto}.stage{position:relative;height:46vh;min-height:300px}.panel{position:static;width:auto;margin:0;border-radius:0;border:0;border-top:1px solid var(--line);box-shadow:none}.rows{max-height:none}
 .hud{position:absolute;left:50%;bottom:12px}.hint{display:none}.card{left:10px;right:10px;top:auto;bottom:10px;width:auto;z-index:5;padding:16px}.card h2{font-size:22px}.card .st{margin:6px 0 10px}.grid2{grid-template-columns:repeat(4,auto);padding:10px 0}.grid2 b{font-size:14px}.cta2{display:none}.src{display:none}.btn{padding:9px 11px}}
</style>

document.getElementById("bDots").onclick=function(){dots=!dots;this.className="btn"+(dots?" on":"");ver++;};
document.getElementById("bTint").onclick=function(){tintBtn=!tintBtn;upTint();};
function turn(d){auto=false;setPlay();vel=0;goal=Math.round((goal!==null?goal:pos))+d*15;}
document.getElementById("bPrev").onclick=function(){turn(-1);};
document.getElementById("bNext").onclick=function(){turn(1);};
/* najlepsza klatka dla lokalu = największa widoczna powierzchnia */
var bestF={};P.forEach(function(fr,i){for(var k in fr){var o=fr[k];if(!o.inf||!o.c)continue;var b=bestF[o.inf.no];if(!b||o.c.a>b.a)bestF[o.inf.no]={a:o.c.a,f:i};}});
function showOn(no){var b=bestF[no];if(!b)return;auto=false;setPlay();vel=0;var cur=((pos%N)+N)%N,d=b.f-cur;if(d>N/2)d-=N;if(d<-N/2)d+=N;goal=pos+d;}
function fmt(x){return x.toFixed(2).replace(".",",");}
function select(no,fromList){sel=no;renderCard();renderRows();if(no&&fromList)showOn(no);}
function renderCard(){var c=document.getElementById("card");
  if(!sel){c.className="card";c.innerHTML="";return;}
  var a=byNo[sel],f=fl(sel);c.className="card open";
  c.innerHTML='<button class="x" id="cx" aria-label="Zamknij">×</button><small>Mieszkanie</small><h2>M.'+pad(sel)+'</h2><div class="st"><span class="dot" style="background:'+ST[a.st].c+'"></span>'+ST[a.st].n+'</div>'+
  '<div class="grid2"><div><span>Powierzchnia</span><b>'+fmt(a.area)+' m²</b></div><div><span>Pokoje</span><b>'+a.rooms+'</b></div><div><span>Piętro</span><b>'+FLN[f]+'</b></div><div><span>Cena</span><b>zapytaj</b></div></div>'+
  '<a class="cta" href="https://www.budstol-invest.pl/inwestycje/adria-view/" target="_blank" rel="noopener">Zapytaj o to mieszkanie</a><button class="cta2" id="cshow">Pokaż na budynku</button>'+
  '<p class="src">Status wg budstol-invest.pl, stan na 12.11.2026.</p>';
  document.getElementById("cx").onclick=function(){select(null);};document.getElementById("cshow").onclick=function(){showOn(sel);};}
function renderRows(){ver++;var L=document.getElementById("rows"),n=0;L.innerHTML="";
  APTS.forEach(function(x){var no=x[0],a=byNo[no],f=fl(no);if(!match(a,f))return;n++;var d=document.createElement("div");
    d.className="row"+(sel===no?" sel":"");
    d.innerHTML='<i class="dot" style="background:'+ST[a.st].c+'"></i><b>M.'+pad(no)+'</b><span>'+a.rooms+' pok. · '+(f===0?"parter":"p. "+f)+'</span><span></span><b class="a">'+fmt(a.area)+' m²</b>';
    d.onclick=function(){select(no,true);};L.appendChild(d);});
  if(!n)L.innerHTML='<div class="none">Brak mieszkań spełniających kryteria.</div>';
  document.getElementById("cnt").textContent=n;upTint();}
function sum(){var c={w:0,r:0,s:0};APTS.forEach(function(x){c[x[3]||"w"]++;});
  document.getElementById("sum").innerHTML=["w","r","s"].map(function(s){return '<span><i class="dot" style="background:'+ST[s].c+'"></i><b>'+c[s]+'</b> '+({w:"wolne",r:"rezerwacje",s:"sprzedane"})[s]+'</span>';}).join("");}
var allChips=[];
function mk(host,key,val,html){var b=document.createElement("button");b.className="chip";b.innerHTML=html;allChips.push(b);
  b.onclick=function(){if(F[key][val])delete F[key][val];else F[key][val]=1;b.className="chip"+(F[key][val]?" on":"");renderRows();};host.appendChild(b);}
[1,2,3,4,5].forEach(function(r){mk(document.getElementById("fRo"),"ro",r,r);});
FLN.forEach(function(n,i){mk(document.getElementById("fFl"),"fl",i,i===0?"Parter":i);});
["w","r","s"].forEach(function(k){mk(document.getElementById("fSt"),"st",k,'<span class="dot" style="background:'+ST[k].c+'"></span>'+ST[k].n);});
var aMin=document.getElementById("aMin"),aMax=document.getElementById("aMax");
function rng(e){var lo=+aMin.value,hi=+aMax.value;if(lo>hi-5){if(e&&e.target===aMin){lo=hi-5;aMin.value=lo;}else{hi=lo+5;aMax.value=hi;}}
  F.a0=lo;F.a1=hi;document.getElementById("aLbl").textContent=lo+"–"+hi+" m²";renderRows();}
aMin.oninput=rng;aMax.oninput=rng;
document.getElementById("clr").onclick=function(){F.st={};F.fl={};F.ro={};aMin.value=25;aMax.value=100;allChips.forEach(function(b){b.className="chip";});rng();};
var hm=/f=(\d+)/.exec(location.hash);if(hm){pos=+hm[1];auto=false;}
sum();rng();setPlay();
})();
</script>
</body>
</html>
